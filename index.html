<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>나의 영화 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 좌측 고정 입력 폼 + 우측 티켓 스텁 형태의 기록 목록, 좁은 화면에선 한 열로 */
:root {
  --bg: #f3f6f2;
  --surface: #ffffff;
  --ink: #1d2a22;
  --muted: #5f6f64;
  --line: #d8e2d9;
  --green: #2f7a4f;
  --green-deep: #1f5638;
  --green-soft: #e3efe6;
  --star: #e3a92b;
  --star-off: #cfd8d0;
  --danger: #b2452f;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121915; --surface: #1a231d; --ink: #e4ece6; --muted: #9aab9f; --line: #2c3a31;
    --green: #6cc193; --green-deep: #9bdab6; --green-soft: #213428;
    --star: #f0bd4c; --star-off: #3a4a40; --danger: #e88a73; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121915; --surface: #1a231d; --ink: #e4ece6; --muted: #9aab9f; --line: #2c3a31;
  --green: #6cc193; --green-deep: #9bdab6; --green-soft: #213428;
  --star: #f0bd4c; --star-off: #3a4a40; --danger: #e88a73; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--green); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); font-weight: 700; margin: 4px 0 0; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 24px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 24px; color: var(--green-deep); font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }

.grid { display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

form {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
}
@media (max-width: 820px) { form { position: static; } }
form h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
label, .label { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type="text"], input[type="date"] {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stars-input { display: flex; align-items: center; gap: 4px; }
.stars-input button {
  background: none; border: 0; padding: 2px; cursor: pointer; font-size: 28px; line-height: 1;
  color: var(--star-off); transition: transform .12s, color .12s;
}
.star { position: relative; display: inline-block; color: var(--star-off); line-height: 1; }
.star .fill { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: var(--star); }
.stars-input { touch-action: manipulation; border-radius: 8px; }
.stars-input:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
.stars-input button:hover { transform: scale(1.12); }
.stars-input output { margin-left: 8px; font-family: var(--font-mono); color: var(--muted); font-size: 14px; }
.error { color: var(--danger); font-size: 13px; margin: -6px 0 0; }
.btn-primary {
  font: inherit; font-weight: 600; color: #fff; background: var(--green);
  border: 0; border-radius: 10px; padding: 12px; cursor: pointer; transition: background .15s;
}
:root[data-theme="dark"] .btn-primary { color: #0f1a13; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #0f1a13; } }
.btn-primary:hover { background: var(--green-deep); }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.toolbar input { max-width: 260px; }
.sort { display: flex; gap: 4px; background: var(--green-soft); padding: 4px; border-radius: 10px; }
.sort button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.sort button[aria-pressed="true"] { background: var(--surface); color: var(--green-deep); font-weight: 600; }

.list { display: grid; gap: 14px; }
.ticket {
  display: grid; grid-template-columns: 1fr 108px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  animation: rise .35s ease both;
}
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .ticket { animation: none; } .stars-input button { transition: none; } }
.ticket-main { padding: 18px 20px; min-width: 0; display: grid; gap: 6px; }
.ticket-title { display: flex; align-items: center; gap: 12px; }
.title-text { display: grid; gap: 6px; min-width: 0; }
.title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ticket h3 { font-family: var(--font-display); font-size: 24px; margin: 0; line-height: 1.3; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.drop {
  display: grid; place-items: center; aspect-ratio: 16 / 10; max-width: 100%; padding: 0 12px; text-align: center;
  border: 1px dashed var(--line); border-radius: 10px; background: var(--bg);
  cursor: pointer; overflow: hidden; color: var(--muted); font-size: 13px; transition: border-color .15s, background .15s;
}
.drop:has(img:not([hidden])) { padding: 0; }
#imageClear { justify-self: start; }
.drop:hover, .drop.over { border-color: var(--green); background: var(--green-soft); }
.drop img { width: 100%; height: 100%; object-fit: cover; }
.drop-hint::before { content: "+"; display: block; text-align: center; font-size: 22px; line-height: 1; color: var(--green); }
input[type="file"]:focus-visible + * { outline: 2px solid var(--green); }
.poster-btn {
  padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--green-soft);
  cursor: zoom-in; display: block; flex: none; width: 40px; height: 56px; align-self: center;
  transition: transform .15s;
}
.poster-btn:hover { transform: scale(1.06); }
.poster { width: 100%; height: 100%; object-fit: cover; display: block; }
.ticket-thumb { padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: 54px; height: 36px; cursor: zoom-in; background: none; }
.ticket-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lightbox {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: rgba(10, 20, 14, .82); cursor: zoom-out;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
.web-links { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.web-links a {
  font-size: 12px; font-weight: 500; color: var(--green-deep); text-decoration: none;
  border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; background: var(--surface);
  transition: background .15s, border-color .15s;
}
.web-links a::after { content: " ↗"; font-size: 10px; }
.web-links a:hover { background: var(--green-soft); border-color: var(--green); }
.web-links a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.tag { font-size: 11px; font-weight: 600; color: var(--green-deep); background: var(--green-soft); padding: 2px 8px; border-radius: 99px; letter-spacing: .04em; }
.credits { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.credits dt { display: inline; font-weight: 600; color: var(--ink); margin-right: 6px; }
.credits dd { display: inline; margin: 0; overflow-wrap: anywhere; }
.review { margin: 6px 0 0; padding-left: 12px; border-left: 2px solid var(--green); font-size: 15px; overflow-wrap: anywhere; }
.stub {
  border-left: 2px dashed var(--line); position: relative;
  display: grid; place-content: center; justify-items: center; gap: 4px; padding: 14px 8px; text-align: center;
  background: var(--green-soft);
}
.stub::before, .stub::after {
  content: ""; position: absolute; left: -9px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line);
}
.stub::before { top: -9px; } .stub::after { bottom: -9px; }
.stub .score { font-family: var(--font-mono); font-size: 26px; color: var(--green-deep); line-height: 1; letter-spacing: -0.08em; }
.stub .score small { letter-spacing: -0.04em; margin-left: 2px; }
.stub .score small { font-size: 13px; color: var(--muted); }
.stub .mini-stars { font-size: 17px; letter-spacing: 0; white-space: nowrap; }
@media (max-width: 480px) { .stub .mini-stars { font-size: 14px; } }
.stub .mini-stars .off { color: var(--star-off); }
.stub .date { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 13px; }
.link-btn { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn.danger { color: var(--danger); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
.note { font-size: 12px; color: var(--muted); margin-top: 16px; }
@media (max-width: 480px) {
  .ticket { grid-template-columns: 1fr 88px; }
  .row2 { grid-template-columns: 1fr; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Watched Films</div>
      <h1>나의 영화 기록장</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>총 본 영화</span></div>
      <div class="stat"><b id="statCount">0</b><span>올해 본 영화</span></div>
      <div class="stat"><b id="statAvg">–</b><span>평균 별점</span></div>
    </div>
  </header>

  <div class="grid">
    <form id="form" novalidate>
      <h2>새 기록 남기기</h2>
      <div class="field">
        <label for="title">영화 제목</label>
        <input type="text" id="title" placeholder="예: 헤어질 결심" autocomplete="off">
      </div>
      <div class="field">
        <label for="director">감독</label>
        <input type="text" id="director" placeholder="예: 박찬욱" autocomplete="off">
      </div>
      <div class="field">
        <label for="cast">배우</label>
        <input type="text" id="cast" placeholder="쉼표로 구분 (예: 탕웨이, 박해일)" autocomplete="off">
      </div>
      <div class="field">
        <span class="label" id="ratingLabel">별점</span>
        <div class="stars-input" id="stars" role="radiogroup" aria-labelledby="ratingLabel"></div>
      </div>
      <div class="field">
        <label for="review">한 줄 감상</label>
        <input type="text" id="review" maxlength="120" placeholder="이 영화를 한 줄로 남겨보세요" autocomplete="off">
      </div>
      <div class="field">
        <span class="label">영화 이미지</span>
        <label class="drop" id="imageDrop" for="image">
          <img id="imagePrev" alt="영화 이미지 미리보기" hidden>
          <span class="drop-hint" id="imageHint">포스터나 티켓 사진을 선택하거나 끌어다 놓으세요</span>
        </label>
        <input type="file" id="image" accept="image/*" class="sr">
        <button type="button" class="link-btn" id="imageClear" hidden>이미지 지우기</button>
      </div>
      <div class="field">
        <label for="date">관람일</label>
        <input type="date" id="date">
      </div>
      <p class="error" id="error" hidden></p>
      <button type="submit" class="btn-primary" id="submitBtn">기록 추가</button>
    </form>

    <section>
      <div class="toolbar">
        <input type="text" id="search" placeholder="제목·감독·배우 검색" aria-label="기록 검색" autocomplete="off">
        <div class="sort" role="group" aria-label="정렬">
          <button type="button" data-sort="date" aria-pressed="true">최신순</button>
          <button type="button" data-sort="rating" aria-pressed="false">별점순</button>
        </div>
      </div>
      <div class="list" id="list"></div>
      <p class="note">기록과 이미지는 이 브라우저에 저장됩니다. 다른 기기나 브라우저에서는 보이지 않아요. 이미지는 저장 공간을 아끼려고 작게 줄여서 보관해요.</p>
    </section>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>

<script>
(function () {
  var KEY = "movie-log-v1";
  var SAMPLES = [
    { id: "s1", sample: true, title: "헤어질 결심", director: "박찬욱", cast: "탕웨이, 박해일", rating: 5, review: "안개처럼 스며드는 영화. 엔딩이 오래 남는다.", date: "2026-10-12" },
    { id: "s2", sample: true, title: "패스트 라이브즈", director: "셀린 송", cast: "그레타 리, 유태오", rating: 4.5, review: "인연이라는 말이 이렇게 조용하게 아플 수 있다니.", date: "2026-09-28" }
  ];
  var store = { ok: true };
  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { store.ok = false; return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(movies.filter(function (m) { return !m.sample; }))); return true; }
    catch (e) { store.ok = false; return false; }
  }
  var saved = load();
  var movies = saved && saved.length ? saved : SAMPLES.slice();
  var rating = 0, sortBy = "date", editingId = null, confirmId = null;

  var $ = function (id) { return document.getElementById(id); };
  var starsEl = $("stars");
  // 별 하나의 채움 정도(0~1)에 맞춰 그리는 별
  function starHTML(fill) {
    return '<span class="star"><span class="fill" style="width:' + Math.round(fill * 100) + '%">★</span>★</span>';
  }
  function starsRow(r) {
    var h = "";
    for (var i = 1; i <= 5; i++) h += starHTML(Math.max(0, Math.min(1, r - i + 1)));
    return h;
  }
  starsEl.setAttribute("role", "slider");
  starsEl.setAttribute("aria-valuemin", "0");
  starsEl.setAttribute("aria-valuemax", "5");
  starsEl.tabIndex = 0;
  for (var i = 1; i <= 5; i++) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.v = i; b.tabIndex = -1;
    b.setAttribute("aria-hidden", "true");
    starsEl.appendChild(b);
  }
  var out = document.createElement("output"); starsEl.appendChild(out);
  function paintStars() {
    starsEl.querySelectorAll("button").forEach(function (b) {
      b.innerHTML = starHTML(Math.max(0, Math.min(1, rating - +b.dataset.v + 1)));
    });
    out.textContent = rating ? rating.toFixed(1) + " / 5" : "선택 안 함";
    starsEl.setAttribute("aria-valuenow", String(rating));
    starsEl.setAttribute("aria-valuetext", rating ? rating + "점" : "선택 안 함");
  }
  starsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var r = b.getBoundingClientRect();
    var half = e.clientX && e.clientX < r.left + r.width / 2;
    rating = +b.dataset.v - (half ? 0.5 : 0); paintStars();
  });
  starsEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "ArrowUp") rating = Math.min(5, rating + 0.5);
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") rating = Math.max(0, rating - 0.5);
    else return;
    e.preventDefault(); paintStars();
  });
  paintStars();

  function today() {
    var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  $("date").value = today();

  // 이미지 업로드: 캔버스로 줄여서 JPEG data URL로 보관
  var imgs = { image: "" };
  var slots = {
    image: { input: "image", prev: "imagePrev", hint: "imageHint", clear: "imageClear", drop: "imageDrop", max: 640 }
  };
  function imgOf(m) { return m.image || m.poster || m.ticket || ""; }
  function shrink(file, max) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error("type")); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("read")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("decode")); };
        img.onload = function () {
          var s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          var ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.8));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function paintSlot(k) {
    var s = slots[k], has = !!imgs[k];
    $(s.prev).hidden = !has; if (has) $(s.prev).src = imgs[k]; else $(s.prev).removeAttribute("src");
    $(s.hint).hidden = has; $(s.clear).hidden = !has;
  }
  function takeFile(k, file) {
    shrink(file, slots[k].max).then(function (url) {
      imgs[k] = url; paintSlot(k); $("error").hidden = true;
    }).catch(function () {
      $("error").textContent = "이미지 파일만 올릴 수 있어요. JPG나 PNG 파일을 골라 주세요."; $("error").hidden = false;
    });
  }
  Object.keys(slots).forEach(function (k) {
    var s = slots[k], drop = $(s.drop);
    $(s.input).addEventListener("change", function (e) { if (e.target.files[0]) takeFile(k, e.target.files[0]); e.target.value = ""; });
    $(s.clear).addEventListener("click", function () { imgs[k] = ""; paintSlot(k); });
    drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
    drop.addEventListener("drop", function (e) {
      e.preventDefault(); drop.classList.remove("over");
      if (e.dataTransfer.files[0]) takeFile(k, e.dataTransfer.files[0]);
    });
  });
  function resetImgs() { imgs.image = ""; paintSlot("image"); }

  function openLightbox(src, alt) { $("lightboxImg").src = src; $("lightboxImg").alt = alt; $("lightbox").hidden = false; }
  $("lightbox").addEventListener("click", function () { $("lightbox").hidden = true; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("lightbox").hidden = true; });

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtDate(s) {
    if (!s) return "";
    var p = s.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    var w = isNaN(d) ? "" : " (" + "일월화수목금토"[d.getDay()] + ")";
    return s.replace(/-/g, ".") + w;
  }
  function webLinks(t) {
    var q = encodeURIComponent(t);
    return '<span class="web-links">' +
      '<a href="https://search.naver.com/search.naver?query=' + encodeURIComponent("영화 " + t) + '" target="_blank" rel="noopener">네이버</a>' +
      '<a href="https://pedia.watcha.com/ko-KR/search?query=' + q + '" target="_blank" rel="noopener">왓챠피디아</a>' +
      '<a href="https://www.themoviedb.org/search?language=ko-KR&query=' + q + '" target="_blank" rel="noopener">TMDB</a>' +
    "</span>";
  }

  function render() {
    var real = movies.filter(function (m) { return !m.sample; });
    var base = real.length ? real : movies;
    $("statTotal").textContent = real.length;
    var year = String(new Date().getFullYear());
    $("statCount").textContent = real.filter(function (m) { return (m.date || "").slice(0, 4) === year; }).length;
    $("statAvg").textContent = real.length ? (real.reduce(function (a, m) { return a + m.rating; }, 0) / real.length).toFixed(1) : "–";

    var q = $("search").value.trim().toLowerCase();
    var list = base.filter(function (m) {
      return !q || [m.title, m.director, m.cast].join(" ").toLowerCase().indexOf(q) > -1;
    }).sort(function (a, b) {
      if (sortBy === "rating" && b.rating !== a.rating) return b.rating - a.rating;
      return (b.date || "").localeCompare(a.date || "") || (b.created || 0) - (a.created || 0);
    });

    var el = $("list");
    if (!list.length) {
      el.innerHTML = '<div class="empty">' + (q ? "‘" + esc(q) + "’에 맞는 기록이 없어요." : "아직 기록이 없어요. 왼쪽에서 첫 영화를 추가해 보세요.") + "</div>";
      return;
    }
    el.innerHTML = list.map(function (m) {
      var stars = starsRow(m.rating);
      var actions = m.sample ? "" : (confirmId === m.id
        ? '<div class="actions"><span>삭제할까요?</span><button class="link-btn danger" data-act="del" data-id="' + m.id + '">삭제</button><button class="link-btn" data-act="cancel">취소</button></div>'
        : '<div class="actions"><button class="link-btn" data-act="edit" data-id="' + m.id + '">수정</button><button class="link-btn" data-act="ask" data-id="' + m.id + '">삭제</button></div>');
      var src = imgOf(m);
      var poster = src ? '<button type="button" class="poster-btn" data-act="view" data-id="' + m.id + '" aria-label="' + esc(m.title) + ' 이미지 크게 보기"><img class="poster" src="' + src + '" alt=""></button>' : "";
      return '<article class="ticket">' +
        '<div class="ticket-main">' +
          '<div class="ticket-title">' + poster +
            '<div class="title-text"><div class="title-line"><h3>' + esc(m.title) + '</h3>' + (m.sample ? '<span class="tag">예시</span>' : "") + "</div>" +
            webLinks(m.title) + "</div></div>" +
          '<dl class="credits">' +
            (m.date ? '<div><dt>관람일</dt><dd>' + fmtDate(m.date) + "</dd></div>" : "") +
            (m.director ? "<div><dt>감독</dt><dd>" + esc(m.director) + "</dd></div>" : "") +
            (m.cast ? "<div><dt>출연</dt><dd>" + esc(m.cast) + "</dd></div>" : "") +
          "</dl>" +
          (m.review ? '<p class="review">' + esc(m.review) + "</p>" : "") +
          actions +
        "</div>" +
        '<div class="stub"><div class="score">' + m.rating + "<small>/5</small></div>" +
          '<div class="mini-stars" aria-label="별점 ' + m.rating + '점">' + stars + "</div>" +
          '<div class="date">' + (m.date ? m.date.replace(/-/g, ".") : "") + "</div></div>" +
      "</article>";
    }).join("");
  }

  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var act = b.dataset.act, id = b.dataset.id;
    if (act === "view") {
      var v = movies.find(function (x) { return x.id === id; });
      if (v && imgOf(v)) openLightbox(imgOf(v), v.title + " 이미지");
      return;
    }
    if (act === "ask") confirmId = id;
    else if (act === "cancel") confirmId = null;
    else if (act === "del") { movies = movies.filter(function (m) { return m.id !== id; }); confirmId = null; save(); }
    else if (act === "edit") {
      var m = movies.find(function (x) { return x.id === id; }); if (!m) return;
      editingId = id;
      $("title").value = m.title; $("director").value = m.director; $("cast").value = m.cast;
      $("review").value = m.review; $("date").value = m.date || today();
      rating = m.rating; paintStars();
      imgs.image = imgOf(m); paintSlot("image");
      $("submitBtn").textContent = "수정 저장";
      $("title").focus();
    }
    render();
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("title").value.trim(), err = $("error");
    if (!title) { err.textContent = "영화 제목을 입력해 주세요."; err.hidden = false; $("title").focus(); return; }
    if (!rating) { err.textContent = "별점을 0.5~5점 중에서 골라 주세요. 별의 왼쪽 절반을 누르면 반 개예요."; err.hidden = false; return; }
    err.hidden = true;
    var data = {
      title: title, director: $("director").value.trim(), cast: $("cast").value.trim(),
      rating: rating, review: $("review").value.trim(), date: $("date").value || today(),
      image: imgs.image, poster: "", ticket: ""
    };
    var before = movies;
    if (editingId) {
      movies = movies.map(function (m) { return m.id === editingId ? Object.assign({}, m, data) : m; });
    } else {
      movies = movies.filter(function (m) { return !m.sample; });
      data.id = "m" + Date.now(); data.created = Date.now();
      movies.push(data);
    }
    if (!save()) {
      movies = before;
      err.textContent = "저장 공간이 부족해서 저장하지 못했어요. 이미지를 빼거나 오래된 기록을 지운 뒤 다시 시도해 주세요.";
      err.hidden = false;
      return;
    }
    editingId = null;
    $("form").reset(); $("date").value = today(); rating = 0; paintStars(); resetImgs();
    $("submitBtn").textContent = "기록 추가";
    render();
  });

  $("search").addEventListener("input", render);
  document.querySelectorAll(".sort button").forEach(function (b) {
    b.addEventListener("click", function () {
      sortBy = b.dataset.sort;
      document.querySelectorAll(".sort button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      render();
    });
  });
  render();
})();
</script>

</body></html>
